name: Auto Submitter (Scheduled)

# Runs the Auto-Discovery crawler & blind submitter daily to discover new AI directories
# Cost: Zero AI API calls, runs via Headless Chrome

on:
  schedule:
    # Run once daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: auto-submitter
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # ── Discovery & Blind Submit ─────────────────────────
      - name: Run Auto Discovery & Blind Submit
        run: |
          echo "🚀 Running Auto-Discovery and Blind Submission script..."
          npm run submit:discover
        env:
          # GitHub Actions network usually doesn't need a proxy for raw.githubusercontent.com
          NODE_ENV: production

      # ── Commit + Push ────────────────────────────────────
      - name: Commit and Push History
        run: |
          if [ -n "$(git status --porcelain scripts/auto-submitter/data/submitted-history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            git pull --rebase --autostash origin main || true
            
            git add scripts/auto-submitter/data/submitted-history.json
            git commit -m "chore(submitter): update blind submission history [skip ci]"
            
            PUSH_OK=0
            for attempt in 1 2 3; do
              if git push; then
                echo "✅ Push succeeded on attempt $attempt"
                PUSH_OK=1
                break
              fi
              echo "⚠️ Push failed (attempt $attempt), resolving..."
              sleep $((attempt * 3))
              git pull --rebase -X theirs --autostash origin main || true
            done
            if [ "$PUSH_OK" -eq 0 ]; then
              echo "⚠️ Push failed after 3 attempts, continuing anyway..."
            fi
          else
            echo "ℹ️ No new history to commit"
          fi
