name: Incremental Build (Daily)

# Daily incremental build: processes only NEW and CHANGED skills
# Uses AI for translation/SEO/agent analysis — but only for delta
# Existing fully-optimized skills are skipped via isSkillFullyOptimized()

on:
  schedule:
    # Run daily at 02:00 UTC (after harvest at 00:00)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max for incremental
    concurrency:
      group: skills-pipeline
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Build Cache (Incremental) ──────────────────────
      - name: Build Skills Cache
        run: npm run build:cache -- --mode=discover --max-duration=150
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── Deploy to Cloudflare ───────────────────────────
      - name: Sync docs & sitemap to KV (skills data → D1 only)
        run: npm run sync:kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync to Cloudflare D1
        run: |
          npx tsx scripts/generate-d1-seed.ts
          ./scripts/run-d1-seeds.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── Commit + Push ──────────────────────────────────
      - name: Commit and Push Cache
        run: |
          if [ -n "$(git status --porcelain data/skills-cache.json data/sitemap-skills.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/skills-cache.json data/sitemap-skills.json
            git commit -m "chore(data): incremental skills update [skip ci]"
            PUSH_OK=0
            for attempt in 1 2 3; do
              if git push; then
                echo "✅ Push succeeded on attempt $attempt"
                PUSH_OK=1
                break
              fi
              echo "⚠️ Push failed (attempt $attempt), resolving conflicts..."
              git pull --rebase -X theirs --autostash origin main || true
            done
            if [ "$PUSH_OK" -eq 0 ]; then
              echo "❌ Push failed after 3 attempts"
              exit 1
            fi
          else
            echo "ℹ️ No cache changes detected"
          fi

      # ── Notify search engines ──────────────────────────
      - name: Submit IndexNow
        if: success()
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
