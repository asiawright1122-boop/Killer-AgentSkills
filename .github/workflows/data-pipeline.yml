name: Data Pipeline

run-name: >-
  Data Pipeline / ${{
    github.event_name == 'schedule' && format('schedule {0}', github.event.schedule) ||
    github.event_name == 'workflow_dispatch' && format('manual {0}', inputs.pipeline) ||
    github.event_name == 'repository_dispatch' && format('crawler {0}', github.event.client_payload.target_repo) ||
    github.event_name
  }}

# Unified data workflow:
# - Harvest (scheduled/manual)
# - Incremental build (scheduled/manual)
# - Full refresh (scheduled/manual)
# - Crawler webhook/manual
# - Auto submitter (scheduled/manual)

on:
  schedule:
    # Incremental lane: incremental build only (08:17 / 20:17 Asia/Shanghai)
    - cron: '17 0,12 * * *'
    # Auto submitter lane (10:37 Asia/Shanghai)
    - cron: '37 2 * * *'
    # Full refresh lane (11:53 Asia/Shanghai, every 5 days)
    - cron: '53 3 */5 * *'
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'Pipeline mode'
        required: true
        type: choice
        options:
          - incremental
          - full
          - crawler
          - harvest
          - auto-submit
        default: incremental
      harvest_mode:
        description: 'Harvest mode (for pipeline=harvest)'
        required: false
        type: choice
        options:
          - harvest
          - enrich
          - prune
        default: harvest
      target:
        description: 'Harvest target (for harvest/incremental/full)'
        required: false
        type: number
        default: 50
      build_mode:
        description: 'Build mode override (for crawler)'
        required: false
        type: choice
        options:
          - update
          - discover
        default: update
      filter:
        description: 'Filter string (for crawler, e.g. owner/repo)'
        required: false
        type: string
        default: ''
      force:
        description: 'Force AI regeneration (for build/full/crawler)'
        required: false
        type: boolean
        default: false
      confirm:
        description: 'Type "yes" to confirm full refresh'
        required: false
        type: string
        default: ''
      skip_harvest:
        description: 'Skip harvest before full refresh'
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [killer-skills-ingest]

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      run_harvest: ${{ steps.resolve.outputs.run_harvest }}
      harvest_mode: ${{ steps.resolve.outputs.harvest_mode }}
      harvest_target: ${{ steps.resolve.outputs.harvest_target }}
      build_mode: ${{ steps.resolve.outputs.build_mode }}
      build_filter: ${{ steps.resolve.outputs.build_filter }}
      build_force: ${{ steps.resolve.outputs.build_force }}
      build_duration: ${{ steps.resolve.outputs.build_duration }}
    steps:
      - name: Resolve Pipeline Mode
        id: resolve
        shell: bash
        env:
          DISPATCH_TARGET_REPO: ${{ github.event.client_payload.target_repo }}
        run: |
          MODE=""
          RUN_HARVEST="false"
          HARVEST_MODE="harvest"
          HARVEST_TARGET="50"
          BUILD_MODE="discover"
          BUILD_FILTER=""
          BUILD_FORCE="false"
          BUILD_DURATION="150"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "17 0,12 * * *")
                MODE="incremental"
                RUN_HARVEST="false"
                HARVEST_TARGET="50"
                BUILD_MODE="discover"
                BUILD_DURATION="150"
                ;;
              "37 2 * * *")
                MODE="auto-submit"
                ;;
              "53 3 */5 * *")
                MODE="full"
                RUN_HARVEST="false"
                BUILD_MODE="update"
                BUILD_DURATION="330"
                ;;
              *)
                echo "Unsupported schedule: ${{ github.event.schedule }}"
                exit 1
                ;;
            esac
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            MODE="crawler"
            BUILD_MODE="update"
            BUILD_FILTER="$DISPATCH_TARGET_REPO"
            BUILD_FORCE="false"
            BUILD_DURATION="330"
          else
            MODE="${{ inputs.pipeline || 'incremental' }}"
            HARVEST_MODE="${{ inputs.harvest_mode || 'harvest' }}"
            HARVEST_TARGET="${{ inputs.target || '50' }}"
            BUILD_MODE="${{ inputs.build_mode || 'update' }}"
            BUILD_FILTER="${{ inputs.filter || '' }}"
            BUILD_FORCE="${{ inputs.force || 'false' }}"

            case "$MODE" in
              incremental)
                # Recovery guardrail: manual incremental refreshes should not
                # restart GitHub skill harvesting unless the operator explicitly
                # selects the dedicated harvest lane.
                RUN_HARVEST="false"
                BUILD_MODE="discover"
                BUILD_DURATION="150"
                ;;
              full)
                RUN_HARVEST="${{ inputs.skip_harvest != true }}"
                BUILD_MODE="update"
                BUILD_DURATION="330"
                if [ "${{ inputs.confirm }}" != "yes" ]; then
                  echo '❌ Manual full refresh requires input: confirm=yes'
                  exit 1
                fi
                ;;
              crawler)
                RUN_HARVEST="false"
                BUILD_DURATION="330"
                ;;
              harvest)
                RUN_HARVEST="true"
                ;;
              auto-submit)
                RUN_HARVEST="false"
                ;;
              *)
                echo "Unsupported pipeline mode: $MODE"
                exit 1
                ;;
            esac
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "run_harvest=$RUN_HARVEST" >> "$GITHUB_OUTPUT"
          echo "harvest_mode=$HARVEST_MODE" >> "$GITHUB_OUTPUT"
          echo "harvest_target=$HARVEST_TARGET" >> "$GITHUB_OUTPUT"
          echo "build_mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"
          echo "build_filter=$BUILD_FILTER" >> "$GITHUB_OUTPUT"
          echo "build_force=$BUILD_FORCE" >> "$GITHUB_OUTPUT"
          echo "build_duration=$BUILD_DURATION" >> "$GITHUB_OUTPUT"

  data-build:
    needs: resolve
    if: needs.resolve.outputs.mode != 'auto-submit'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: skills-pipeline
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          lfs: false

      - name: Ensure latest data
        run: git pull --rebase --autostash origin main || true

      - name: Download cache artifact
        continue-on-error: true
        run: bash scripts/cache-artifact.sh download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Cleanup expired skill interactions
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: npm run cleanup:skill-interactions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Validate AI Guardrails
        run: npm run guard:ai-config
        env:
          NVIDIA_API_KEYS: ${{ secrets['NVIDIA_API_KEY'] }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'

      - name: Run Harvest
        if: needs.resolve.outputs.run_harvest == 'true'
        run: |
          MODE="${{ needs.resolve.outputs.harvest_mode }}"
          TARGET="${{ needs.resolve.outputs.harvest_target }}"

          if [ "$MODE" = "prune" ]; then
            npx tsx scripts/harvest-github-skills.ts --prune
          elif [ "$MODE" = "enrich" ]; then
            npx tsx scripts/harvest-github-skills.ts --enrich
          else
            npx tsx scripts/harvest-github-skills.ts --target="$TARGET"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Skills Cache
        if: needs.resolve.outputs.mode != 'harvest'
        run: |
          ARGS="--mode=${{ needs.resolve.outputs.build_mode }} --max-duration=${{ needs.resolve.outputs.build_duration }}"

          if [ -n "${{ needs.resolve.outputs.build_filter }}" ]; then
            ARGS="$ARGS --filter=${{ needs.resolve.outputs.build_filter }}"
          fi

          if [ "${{ needs.resolve.outputs.build_force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          echo "🚀 Running: npm run build:cache -- $ARGS"
          npm run build:cache -- $ARGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEYS: ${{ secrets['NVIDIA_API_KEY'] }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'

      - name: Build SSR Translations Cache
        if: needs.resolve.outputs.mode != 'harvest'
        run: npm run build:translations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NVIDIA_API_KEYS: ${{ secrets['NVIDIA_API_KEY'] }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'

      - name: Enrich Collections Metadata
        if: needs.resolve.outputs.mode == 'full' || (needs.resolve.outputs.mode == 'harvest' && needs.resolve.outputs.harvest_mode == 'enrich')
        run: |
          npm run enrichment:batch -- --limit=5
          npm run enrichment:apply
        env:
          NVIDIA_API_KEYS: ${{ secrets['NVIDIA_API_KEY'] }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Validate Enrichment Pre-flight
        if: needs.resolve.outputs.mode != 'harvest'
        run: npm run guard:enrichment-preflight

      - name: Validate Public Skill Cache Projection
        if: needs.resolve.outputs.mode != 'harvest'
        run: npm run guard:public-skill-cache

      - name: Commit and Push
        run: |
          MODE="${{ needs.resolve.outputs.mode }}"
          CHANGED=""
          MSG=""

          if [ "$MODE" = "harvest" ]; then
            CHANGED="$(git status --porcelain data/expanded-github-skills.json)"
            if [ -n "$CHANGED" ]; then
              git add data/expanded-github-skills.json
              MSG="chore(data): harvest update [skip ci]"
            fi
          else
            CHANGED="$(git status --porcelain data/ src/content/collections/)"
            if [ -n "$CHANGED" ]; then
              git add data/sitemap-skills.json data/expanded-github-skills.json data/seo-skill-locale-governance.json src/content/collections/
              if [ "$MODE" = "full" ]; then
                MSG="chore(data): full refresh [skip ci]"
              elif [ "$MODE" = "crawler" ]; then
                FILTER="${{ needs.resolve.outputs.build_filter }}"
                MSG="chore(data): crawler update${FILTER:+ for $FILTER} [skip ci]"
              else
                MSG="chore(data): incremental skills update [skip ci]"
              fi
            fi
          fi

          if [ -z "$MSG" ]; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin main || true
          git commit -m "$MSG"

          PUSH_OK=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Push succeeded on attempt $attempt"
              PUSH_OK=1
              break
            fi
            echo "⚠️ Push failed (attempt $attempt), resolving..."
            sleep $((attempt * 3))
            git pull --rebase -X theirs --autostash origin main || true
          done

          if [ "$PUSH_OK" -eq 0 ]; then
            echo "❌ Push failed after 5 attempts"
            exit 1
          fi

      - name: Upload cache artifact
        if: needs.resolve.outputs.mode != 'harvest' && hashFiles('data/skills-cache.json') != ''
        continue-on-error: true
        run: bash scripts/cache-artifact.sh upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to Cloudflare KV
        if: needs.resolve.outputs.mode != 'harvest'
        continue-on-error: true
        run: npm run sync:kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync to Cloudflare D1 (Delta)
        if: needs.resolve.outputs.mode == 'incremental'
        continue-on-error: true
        run: npm run sync:d1:delta
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Sync to Cloudflare D1 (Full Reseed)
        if: needs.resolve.outputs.mode == 'full' || needs.resolve.outputs.mode == 'crawler'
        continue-on-error: true
        run: |
          npx tsx scripts/generate-d1-seed.ts
          npm run guard:public-d1-seeds
          ./scripts/run-d1-seeds.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Refresh AI Runtime Probe
        if: needs.resolve.outputs.mode != 'harvest'
        run: npm run probe:ai:runtime
        env:
          NVIDIA_API_KEYS: ${{ secrets['NVIDIA_API_KEY'] }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'

      - name: Refresh Direct AI Provider Probe
        if: needs.resolve.outputs.mode != 'harvest'
        run: npm run probe:ai:providers -- --fail-on=none
        env:
          NVIDIA_API_KEYS: ${{ secrets['NVIDIA_API_KEY'] }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'

      - name: Build AI Provider Health Report
        if: needs.resolve.outputs.mode != 'harvest'
        # Provider health is operational telemetry for follow-up, not a reason to mark
        # an otherwise successful data refresh as failed after data has been built.
        run: npm run report:ai:health -- --limit=20 --fail-on=none
        env:
          AI_ALERT_FAIL_ON_SEVERITY: none
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'

      - name: Upload AI Telemetry Artifact
        if: always() && needs.resolve.outputs.mode != 'harvest'
        uses: actions/upload-artifact@v7
        with:
          name: ai-telemetry-report
          path: |
            reports/seo/latest-ai-config-guard.json
            reports/seo/latest-ai-config-guard.md
            reports/seo/latest-ai-runtime-summary.json
            reports/seo/latest-ai-runtime-summary.md
            reports/seo/latest-ai-provider-probe.json
            reports/seo/latest-ai-provider-probe.md
            reports/seo/latest-ai-provider-probe-trend.json
            reports/seo/latest-ai-provider-probe-trend.md
            reports/seo/latest-ai-telemetry-summary.md
            reports/seo/latest-ai-telemetry-trend.json
            reports/seo/latest-ai-telemetry-trend.md
            reports/seo/latest-ai-provider-health.json
            reports/seo/latest-ai-provider-health.md
            reports/seo/phase-02-batch-progress*.summary.md
          if-no-files-found: warn
          retention-days: 21

      - name: Submit IndexNow
        if: needs.resolve.outputs.mode != 'harvest' && success()
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs

      - name: Publish Pipeline Summary
        if: always()
        env:
          AI_ALERT_FAIL_ON_SEVERITY: none
        run: |
          echo "# Data Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schedule: ${{ github.event.schedule || 'manual / dispatch' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ needs.resolve.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Harvest enabled: ${{ needs.resolve.outputs.run_harvest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build mode: ${{ needs.resolve.outputs.build_mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build filter: ${{ needs.resolve.outputs.build_filter || 'none' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Force regenerate: ${{ needs.resolve.outputs.build_force }}" >> "$GITHUB_STEP_SUMMARY"

          if [ -f reports/seo/latest-ai-config-guard.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,160p' reports/seo/latest-ai-config-guard.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f reports/seo/latest-ai-provider-health.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,240p' reports/seo/latest-ai-provider-health.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f reports/seo/latest-ai-telemetry-trend.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## AI Provider Health" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Threshold: ${AI_ALERT_FAIL_ON_SEVERITY}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,220p' reports/seo/latest-ai-telemetry-trend.md >> "$GITHUB_STEP_SUMMARY"
            if [ -f reports/seo/latest-ai-runtime-summary.md ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              sed -n '1,220p' reports/seo/latest-ai-runtime-summary.md >> "$GITHUB_STEP_SUMMARY"
            elif [ -f reports/seo/latest-ai-telemetry-summary.md ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              sed -n '1,220p' reports/seo/latest-ai-telemetry-summary.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## AI Provider Health" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Threshold: ${AI_ALERT_FAIL_ON_SEVERITY}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Provider health report was not generated in this run." >> "$GITHUB_STEP_SUMMARY"
          fi

  auto-submit:
    needs: resolve
    if: needs.resolve.outputs.mode == 'auto-submit'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: skills-pipeline
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Auto Discovery & Blind Submit
        run: npm run submit:discover
        env:
          NODE_ENV: production

      - name: Commit and Push History
        run: |
          if [ -z "$(git status --porcelain scripts/auto-submitter/data/submitted-history.json)" ]; then
            echo "ℹ️ No new history to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin main || true

          git add scripts/auto-submitter/data/submitted-history.json
          git commit -m "chore(submitter): update blind submission history [skip ci]"

          PUSH_OK=0
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "✅ Push succeeded on attempt $attempt"
              PUSH_OK=1
              break
            fi
            echo "⚠️ Push failed (attempt $attempt), resolving..."
            sleep $((attempt * 3))
            git pull --rebase -X theirs --autostash origin main || true
          done

          if [ "$PUSH_OK" -eq 0 ]; then
            echo "❌ Push failed after 5 attempts"
            exit 1
          fi

      - name: Publish Pipeline Summary
        if: always()
        run: |
          echo "# Data Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schedule: ${{ github.event.schedule || 'manual / dispatch' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ needs.resolve.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: blind directory submission" >> "$GITHUB_STEP_SUMMARY"
