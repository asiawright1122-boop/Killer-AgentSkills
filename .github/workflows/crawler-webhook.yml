name: Webhook Targeted Ingestion (Zero-Latency Pipeline)

on:
  repository_dispatch:
    types: [killer-skills-ingest]

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Validate Target Repo
        run: |
          if [ -z "${{ github.event.client_payload.target_repo }}" ]; then
            echo "❌ Error: Missing target_repo in dispatch payload."
            exit 1
          fi
          echo "🎯 Targeting Repository: ${{ github.event.client_payload.target_repo }}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fast AI Ingestion (Targeted Mode)
        run: npm run build:cache -- --filter=${{ github.event.client_payload.target_repo }} --mode=update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync to Cloudflare KV
        run: npm run sync:kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync Updated Skill to D1 Database Serverless
        run: npm run sync:admin:d1 -- --target=${{ github.event.client_payload.target_repo }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Commit and Push Sub-Minute Modifications
        run: |
          if [ -n "$(git status --porcelain data/skills-cache.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/skills-cache.json data/sitemap-skills.json
            git commit -m "chore: instant ingestion for ${{ github.event.client_payload.target_repo }} [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                echo "🚀 Targeted ingestion successful and deployed! (attempt $attempt)"
                break
              fi
              echo "⚠️ Push failed (attempt $attempt), resolving conflicts..."
              git pull --rebase origin main || {
                git checkout --theirs data/skills-cache.json data/sitemap-skills.json 2>/dev/null || true
                git add data/skills-cache.json data/sitemap-skills.json
                git rebase --continue || git rebase --abort
                git add data/skills-cache.json data/sitemap-skills.json
                git commit -m "chore: instant ingestion for ${{ github.event.client_payload.target_repo }} [skip ci]" --allow-empty || true
              }
            done
          else
            echo "ℹ️ Target matched local hash. Zero modification required."
          fi
