name: Skills Crawler (Full Update)

on:
  # Run every 3 days at midnight UTC
  schedule:
    - cron: '0 0 */3 * *'
  # 手动触发
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max
    # 防止多个 workflow 同时运行导致冲突
    concurrency:
      group: skills-crawler
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run skills cache builder (Update Mode + Live Sync)
        run: npm run build:cache -- --mode=update --max-duration=330
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain data/skills-cache.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync to Cloudflare KV
        run: npm run sync:kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync to Cloudflare D1 (Serverless SQL)
        run: |
          npx tsx scripts/generate-d1-seed.ts
          npx wrangler d1 execute killer-skills-db --remote --file=db/seeds/initial.sql
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Commit and Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/skills-cache.json data/sitemap-skills.json
          git commit -m "chore: full skills update [skip ci]"
          # Robust push with conflict auto-resolution for data files
          for attempt in 1 2 3; do
            if git push; then
              echo "✅ Push succeeded on attempt $attempt"
              break
            fi
            echo "⚠️ Push failed (attempt $attempt), resolving conflicts..."
            git pull --rebase origin main || {
              echo "🔧 Rebase conflict detected, auto-resolving data files..."
              git checkout --theirs data/skills-cache.json data/sitemap-skills.json 2>/dev/null || true
              git add data/skills-cache.json data/sitemap-skills.json
              git rebase --continue || git rebase --abort
              # Fallback: re-commit after abort
              git add data/skills-cache.json data/sitemap-skills.json
              git commit -m "chore: full skills update [skip ci]" --allow-empty || true
            }
          done

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
            echo "✅ Skills cache updated and pushed at $(date)"
          else
            echo "ℹ️ No changes detected at $(date)"
          fi
