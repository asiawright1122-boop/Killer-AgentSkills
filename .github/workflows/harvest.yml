name: Skill Harvest (Scheduled)

# Lightweight crawling: discovers new SKILL.md files from GitHub
# Does NOT run AI translation — that's handled by incremental-build.yml
# Cost: Zero AI API calls

on:
  schedule:
    # Run twice daily — 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Max new skills to discover'
        required: false
        type: number
        default: 50
      mode:
        description: 'Run mode'
        required: false
        type: choice
        options:
          - harvest
          - enrich
          - prune
        default: harvest

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: skills-harvest
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false  # Not needed — only modifies expanded-github-skills.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Harvest ──────────────────────────────────────────
      - name: Run Harvest
        run: |
          MODE="${{ inputs.mode || 'harvest' }}"
          TARGET="${{ inputs.target || '50' }}"

          if [ "$MODE" = "prune" ]; then
            echo "🔪 Running prune mode..."
            npx tsx scripts/harvest-github-skills.ts --prune
          elif [ "$MODE" = "enrich" ]; then
            echo "📊 Running enrich mode..."
            npx tsx scripts/harvest-github-skills.ts --enrich
          else
            echo "🌾 Running harvest mode (target: $TARGET)..."
            npx tsx scripts/harvest-github-skills.ts --target=$TARGET
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Commit + Push ────────────────────────────────────
      - name: Commit and Push
        run: |
          if [ -n "$(git status --porcelain data/expanded-github-skills.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # Pre-emptively pull latest to minimize conflicts before committing
            git pull --rebase --autostash origin main || true
            
            git add data/expanded-github-skills.json
            git commit -m "chore(data): harvest new skills [skip ci]"
            PUSH_OK=0
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "✅ Push succeeded on attempt $attempt"
                PUSH_OK=1
                break
              fi
              echo "⚠️ Push failed (attempt $attempt), resolving..."
              sleep $((attempt * 3))
              git pull --rebase -X theirs --autostash origin main || true
            done
            if [ "$PUSH_OK" -eq 0 ]; then
              echo "⚠️ Push failed after 5 attempts, continuing anyway..."
            fi
          else
            echo "ℹ️ No new skills harvested"
          fi
