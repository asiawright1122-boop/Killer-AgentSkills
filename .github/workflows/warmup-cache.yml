name: Cache Warmup Pipeline

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of top skills to warm up (e.g. 100)'
        required: true
        default: '100'
        type: string
      concurrency:
        description: 'Concurrency level (1-10)'
        required: false
        default: '2'
        type: string
  workflow_run:
    workflows: ['Data Pipeline'] # Implicitly link to data pipeline updates
    types:
      - completed
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2am fallback

jobs:
  warmup:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Skills Cache Artifact
        continue-on-error: true
        run: bash scripts/cache-artifact.sh download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute SSR Cache Warmup Probe
        run: npm run cache:warmup
        env:
          WARMUP_LIMIT: ${{ github.event.inputs.limit || '100' }}
          WARMUP_CONCURRENCY: ${{ github.event.inputs.concurrency || '2' }}
          PUBLIC_SITE_URL: 'https://killer-skills.com'
