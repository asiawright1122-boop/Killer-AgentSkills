name: Skills Repairs (Force)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Filter string (e.g. skill-id or repo)'
        required: true
        type: string
      force:
        description: 'Force regeneration?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: skills-pipeline
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run skills cache builder (Repair Mode)
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" == "true" ]; then
            FORCE_FLAG="--force"
          fi
          
          npm run build:cache -- --mode=update $FORCE_FLAG --filter="${{ inputs.filter }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain data/skills-cache.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync to Cloudflare KV
        run: npm run sync:kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync to Cloudflare D1 (Serverless SQL)
        run: |
          npx tsx scripts/generate-d1-seed.ts
          npx wrangler d1 execute killer-skills-db --remote --file=db/seeds/initial.sql
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Commit and Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/skills-cache.json data/sitemap-skills.json
          git commit -m "chore: manual repair for ${{ inputs.filter }} [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "✅ Push succeeded on attempt $attempt"
              break
            fi
            echo "⚠️ Push failed (attempt $attempt), resolving conflicts..."
            git pull --rebase --autostash origin main || {
              echo "🔧 Rebase conflict detected, auto-resolving data files..."
              git checkout --theirs data/skills-cache.json data/sitemap-skills.json 2>/dev/null || true
              git add data/skills-cache.json data/sitemap-skills.json
              git rebase --continue || git rebase --abort
              git add data/skills-cache.json data/sitemap-skills.json
              git commit -m "chore: manual repair for ${{ inputs.filter }} [skip ci]" --allow-empty || true
            }
          done

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
            echo "✅ Repair completed and pushed at $(date)"
          else
            echo "ℹ️ No changes detected/needed at $(date)"
          fi
