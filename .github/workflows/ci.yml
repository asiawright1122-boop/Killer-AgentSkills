name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    name: Lint & Format
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: HUSKY=0 npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint SEO Automation Files
        run: npm run lint:seo-automation

      - name: Format Check (Prettier)
        run: npm run format:check

      - name: Format Check SEO Automation Files
        run: npm run format:check:seo-automation

      - name: Validate Blog SEO Frontmatter
        run: npm run seo:frontmatter:guard

      - name: Translation Key Sync Check
        run: npx tsx scripts/sync-translations.ts --check

      - name: Astro Check (TypeScript + Astro diagnostics)
        run: npm run check:astro

  test:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    name: Unit Tests & Coverage
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: HUSKY=0 npm ci

      - name: Validate AI Guardrails
        env:
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'
        run: npm run guard:ai-config

      - name: Run AI Fallback Regression Suite
        run: npm run test:ai

      - name: Run Unit Tests with Coverage
        run: npx vitest run --coverage --reporter=default

      - name: Refresh AI Runtime Probe
        env:
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'
        run: npm run probe:ai:runtime

      - name: Build AI Provider Health Artifact
        env:
          AI_ALERT_FAIL_ON_SEVERITY: critical
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'
        run: npm run report:ai:health -- --limit=20 --fail-on=${AI_ALERT_FAIL_ON_SEVERITY}

      - name: Build Content Governance Artifact
        env:
          CONTENT_GOVERNANCE_FAIL_ON_SEVERITY: blocking
        run: npm run report:content:governance -- --fail-on=${CONTENT_GOVERNANCE_FAIL_ON_SEVERITY}

      - name: Build Operator Ops Summary
        env:
          OPS_REMEDIATION_AI_THRESHOLD: warning
          OPS_REMEDIATION_GOVERNANCE_THRESHOLD: warning
        run: npm run report:ops:summary -- --ai-threshold=${OPS_REMEDIATION_AI_THRESHOLD} --governance-threshold=${OPS_REMEDIATION_GOVERNANCE_THRESHOLD}

      - name: Upload Coverage Report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload Operator Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operator-reports-ci
          path: |
            reports/seo/latest-ai-config-guard.json
            reports/seo/latest-ai-config-guard.md
            reports/seo/latest-ai-runtime-summary.json
            reports/seo/latest-ai-runtime-summary.md
            reports/seo/latest-ai-provider-health.json
            reports/seo/latest-ai-provider-health.md
            reports/seo/latest-ai-provider-probe-trend.json
            reports/seo/latest-ai-provider-probe-trend.md
            reports/seo/latest-ai-telemetry-summary.md
            reports/seo/latest-ai-telemetry-trend.json
            reports/seo/latest-ai-telemetry-trend.md
            reports/seo/latest-content-governance.json
            reports/seo/latest-content-governance.md
            reports/seo/latest-ops-summary.json
            reports/seo/latest-ops-summary.md
            reports/seo/latest-ops-remediation.json
            reports/seo/latest-ops-remediation.md
            reports/seo/latest-ops-handoff.json
            reports/seo/latest-ops-handoff.md
            reports/seo/latest-ops-handoff-publication.json
            reports/seo/latest-ops-handoff-publication.md
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Operator Summary
        if: always()
        env:
          AI_ALERT_FAIL_ON_SEVERITY: critical
          CONTENT_GOVERNANCE_FAIL_ON_SEVERITY: blocking
          OPS_REMEDIATION_AI_THRESHOLD: warning
          OPS_REMEDIATION_GOVERNANCE_THRESHOLD: warning
        run: |
          echo "# CI Operator Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI health threshold: ${AI_ALERT_FAIL_ON_SEVERITY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Content governance threshold: ${CONTENT_GOVERNANCE_FAIL_ON_SEVERITY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remediation AI threshold: ${OPS_REMEDIATION_AI_THRESHOLD}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remediation governance threshold: ${OPS_REMEDIATION_GOVERNANCE_THRESHOLD}" >> "$GITHUB_STEP_SUMMARY"

          if [ -f reports/seo/latest-ai-config-guard.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,160p' reports/seo/latest-ai-config-guard.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f reports/seo/latest-ops-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,220p' reports/seo/latest-ops-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f reports/seo/latest-ops-handoff.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,220p' reports/seo/latest-ops-handoff.md >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    name: Build
    needs: [lint, test]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: HUSKY=0 npm ci

      - name: Build
        run: npm run build

      - name: Validate Build Output
        run: npx vitest run --config vitest.build-validation.config.ts --reporter=default --no-coverage

      - name: Start Local SEO Smoke Server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4321 > /tmp/killer-skills-seo.log 2>&1 &
          echo $! > /tmp/killer-skills-seo.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/en >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "❌ Local Astro server did not become ready"
          cat /tmp/killer-skills-seo.log || true
          exit 1

      - name: Run SEO Smoke Check
        run: npm run seo:smoke -- http://127.0.0.1:4321

      - name: Run Local SEO Crawl Health Check
        env:
          SEO_CRAWL_SAMPLE_SKILLS_PER_SITEMAP: '0'
          SEO_CRAWL_SAMPLE_NON_SKILLS_PER_SITEMAP: '600'
          SEO_CRAWL_CONCURRENCY: '20'
          SEO_CRAWL_TIMEOUT_MS: '15000'
          SEO_CRAWL_RETRIES: '3'
          SEO_CRAWL_RETRY_DELAY_MS: '1000'
          SEO_CRAWL_HARD_FAIL_5XX_MIN: '1'
          SEO_CRAWL_HARD_FAIL_5XX_RATE: '0.001'
          SEO_CRAWL_HARD_FAIL_FLAKY_5XX_MIN: '1'
          SEO_CRAWL_HARD_FAIL_FLAKY_5XX_RATE: '0.001'
          SEO_CRAWL_HARD_FAIL_CF1102_MIN: '1'
          SEO_CRAWL_HARD_FAIL_4XX_RATE: '0'
        run: npm run report:seo:crawl-health -- http://127.0.0.1:4321

      - name: Stop Local SEO Smoke Server
        if: always()
        run: |
          if [ -f /tmp/killer-skills-seo.pid ]; then
            kill "$(cat /tmp/killer-skills-seo.pid)" || true
          fi
          rm -f /tmp/killer-skills-seo.pid

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json

      - name: Notify IndexNow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: npm run submit:indexnow

      - name: Notify Baidu (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          BAIDU_TOKEN: ${{ secrets['BAIDU_TOKEN'] || '' }}
        run: |
          if [ -n "$BAIDU_TOKEN" ]; then
            npm run submit:baidu
          else
            echo "ℹ️ BAIDU_TOKEN not configured, skipping Baidu submission"
          fi
