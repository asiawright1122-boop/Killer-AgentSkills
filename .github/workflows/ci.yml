name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - '*.md'
      - 'scripts/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint)
        run: npm run lint
        continue-on-error: true

      - name: Format Check (Prettier)
        run: npm run format:check
        continue-on-error: true

      - name: Astro Check (TypeScript + Astro diagnostics)
        run: npx astro check
        continue-on-error: true

      - name: Run Unit Tests
        run: npm test

      - name: Build
        run: npm run build
