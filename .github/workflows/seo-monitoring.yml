name: SEO And Operator Monitoring

on:
  workflow_dispatch:
  schedule:
    # Daily 10:15 Asia/Shanghai (02:15 UTC)
    - cron: '15 2 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gsc-monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: HUSKY=0 npm ci

      - name: Validate AI Guardrails
        env:
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'
        run: npm run guard:ai-config

      - name: Refresh AI Runtime Probe
        env:
          NVIDIA_API_KEYS: ${{ secrets['NVIDIA_API_KEY'] }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'
        run: npm run probe:ai:runtime

      - name: Refresh Direct AI Provider Probe
        env:
          NVIDIA_API_KEYS: ${{ secrets['NVIDIA_API_KEY'] }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'
        run: npm run probe:ai:providers -- --fail-on=none

      - name: Build AI Provider Health Report
        env:
          AI_ALERT_FAIL_ON_SEVERITY: critical
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'
        run: npm run report:ai:health -- --limit=20 --fail-on=${AI_ALERT_FAIL_ON_SEVERITY}

      - name: Build Content Governance Report
        env:
          CONTENT_GOVERNANCE_FAIL_ON_SEVERITY: blocking
        run: npm run report:content:governance -- --fail-on=${CONTENT_GOVERNANCE_FAIL_ON_SEVERITY}

      - name: Build Operator Ops Summary
        env:
          OPS_REMEDIATION_AI_THRESHOLD: warning
          OPS_REMEDIATION_GOVERNANCE_THRESHOLD: warning
          OPS_HANDOFF_MODE: ${{ vars.OPS_HANDOFF_MODE || 'none' }}
          OPS_HANDOFF_OWNER: ${{ vars.OPS_HANDOFF_OWNER || github.repository_owner }}
          OPS_HANDOFF_REPO: ${{ vars.OPS_HANDOFF_REPO || github.event.repository.name }}
          OPS_HANDOFF_BASE_BRANCH: ${{ vars.OPS_HANDOFF_BASE_BRANCH || github.event.repository.default_branch }}
          OPS_HANDOFF_LABELS: ${{ vars.OPS_HANDOFF_LABELS || 'ops-remediation,automated' }}
        run: npm run report:ops:summary -- --ai-threshold=${OPS_REMEDIATION_AI_THRESHOLD} --governance-threshold=${OPS_REMEDIATION_GOVERNANCE_THRESHOLD}

      - name: Publish Operator Remediation Handoff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS_HANDOFF_MODE: ${{ vars.OPS_HANDOFF_MODE || 'none' }}
          OPS_HANDOFF_OWNER: ${{ vars.OPS_HANDOFF_OWNER || github.repository_owner }}
          OPS_HANDOFF_REPO: ${{ vars.OPS_HANDOFF_REPO || github.event.repository.name }}
          OPS_HANDOFF_BASE_BRANCH: ${{ vars.OPS_HANDOFF_BASE_BRANCH || github.event.repository.default_branch }}
          OPS_HANDOFF_LABELS: ${{ vars.OPS_HANDOFF_LABELS || 'ops-remediation,automated' }}
        run: npm run publish:ops:handoff

      - name: Run Production SEO Smoke
        env:
          SEO_SMOKE_CACHE_BUST: '1'
        run: npm run seo:smoke -- https://killer-skills.com

      - name: Fetch GSC Report
        id: gsc
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_REPORT_DAYS: '28'
          GSC_ROW_LIMIT: '1000'
          GSC_OVERWRITE_LATEST_ON_BLOCKING: '1'
        run: |
          mkdir -p reports/gsc
          if [ -z "$GSC_CLIENT_EMAIL" ] || [ -z "$GSC_PRIVATE_KEY" ] || [ -z "$GSC_SITE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            npm run report:gsc:fetch
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          npm run report:gsc:fetch

      - name: Run URL Inspection Coverage Sweep
        if: ${{ steps.gsc.outputs.configured == 'true' }}
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: npm run report:seo:coverage-sweep:p0

      - name: Validate P0 Structured Data
        if: always()
        run: npm run report:seo:structured-data-validate

      - name: Build GSC Opportunity Board
        if: always()
        run: |
          mkdir -p reports/seo
          npm run report:gsc:opportunities

      - name: Run Sitemap Crawl Health Audit
        env:
          SEO_CRAWL_SAMPLE_SKILLS_PER_SITEMAP: '40'
          SEO_CRAWL_SAMPLE_NON_SKILLS_PER_SITEMAP: '600'
          SEO_CRAWL_CONCURRENCY: '20'
          SEO_CRAWL_TIMEOUT_MS: '15000'
          SEO_CRAWL_RETRIES: '4'
          SEO_CRAWL_RETRY_DELAY_MS: '1000'
          SEO_CRAWL_HARD_FAIL_5XX_MIN: '3'
          SEO_CRAWL_HARD_FAIL_5XX_RATE: '0.005'
          SEO_CRAWL_HARD_FAIL_FLAKY_5XX_MIN: '3'
          SEO_CRAWL_HARD_FAIL_FLAKY_5XX_RATE: '0.002'
          SEO_CRAWL_HARD_FAIL_CF1102_MIN: '1'
          SEO_CRAWL_HARD_FAIL_4XX_RATE: '0.05'
        run: |
          mkdir -p reports/seo
          npm run report:seo:crawl-health -- https://killer-skills.com

      - name: Build SEO 404 Rules Artifact
        if: always()
        run: |
          if [ -f reports/seo/latest-404-remediation-plan.json ]; then
            npm run report:seo:404-rules
          else
            echo "Skip SEO 404 rules generation: reports/seo/latest-404-remediation-plan.json not found"
          fi

      - name: Build SEO Sitemap Blocklist Artifact
        if: always()
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -f reports/seo/latest-crawl-health.json ] || [ -f reports/seo/latest-crawl-health.md ]; then
            if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
              npm run report:seo:sitemap-blocklist:d1 -- --prune-stale
            else
              npm run report:seo:sitemap-blocklist -- --prune-stale
            fi
          else
            echo "Skip sitemap blocklist generation: crawl health reports not found"
          fi

      - name: Build Search Compliance Matrix
        if: always()
        run: npm run report:seo:compliance-matrix

      - name: Build Traffic Proof Dashboard
        if: always()
        env:
          CREDENTIALS_PRESENT: ${{ steps.gsc.outputs.configured }}
        run: npm run report:seo:traffic-proof

      - name: Upload GSC Monitoring Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gsc-monitoring-report
          path: |
            reports/gsc/
            reports/seo/
          retention-days: 21

      - name: Publish Job Summary
        if: always()
        env:
          AI_ALERT_FAIL_ON_SEVERITY: critical
          CONTENT_GOVERNANCE_FAIL_ON_SEVERITY: blocking
          OPS_REMEDIATION_AI_THRESHOLD: warning
          OPS_REMEDIATION_GOVERNANCE_THRESHOLD: warning
        run: |
          echo "# Operator Monitoring" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI health threshold: ${AI_ALERT_FAIL_ON_SEVERITY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Content governance threshold: ${CONTENT_GOVERNANCE_FAIL_ON_SEVERITY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remediation AI threshold: ${OPS_REMEDIATION_AI_THRESHOLD}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remediation governance threshold: ${OPS_REMEDIATION_GOVERNANCE_THRESHOLD}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Crawl 5xx min/rate: 3 / 0.005" >> "$GITHUB_STEP_SUMMARY"
          echo "- Crawl flaky 5xx min/rate: 3 / 0.002" >> "$GITHUB_STEP_SUMMARY"
          echo "- Crawl Cloudflare 1102 min: 1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Crawl 4xx rate: 0.05" >> "$GITHUB_STEP_SUMMARY"
          echo "- Crawl on-page SEO errors: 0 tolerated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Crawl sitemap redirects: 0 tolerated" >> "$GITHUB_STEP_SUMMARY"

          if [ -f reports/seo/latest-ops-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,220p' reports/seo/latest-ops-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f reports/seo/latest-ops-handoff-publication.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,220p' reports/seo/latest-ops-handoff-publication.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f reports/gsc/latest-ctr-report.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,220p' reports/gsc/latest-ctr-report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f reports/gsc/monitoring-skipped.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat reports/gsc/monitoring-skipped.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f reports/seo/latest-gsc-opportunity-board.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,220p' reports/seo/latest-gsc-opportunity-board.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f reports/seo/latest-crawl-health.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,220p' reports/seo/latest-crawl-health.md >> "$GITHUB_STEP_SUMMARY"
          elif [ ! -f reports/seo/latest-ai-provider-health.md ] && [ ! -f reports/seo/latest-content-governance.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No operator monitoring report artifact was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f reports/seo/latest-crawl-health.json ]; then
            node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          try {
            const crawl = JSON.parse(fs.readFileSync('reports/seo/latest-crawl-health.json', 'utf8'));
            const totals = crawl?.totals || {};
            const status = crawl?.statusSummary || {};
            const redirects = Array.isArray(crawl?.redirects) ? crawl.redirects.length : 0;
            const onPageSeoErrors = Array.isArray(crawl?.onPageSeoErrors) ? crawl.onPageSeoErrors.length : 0;
            console.log('');
            console.log('### Crawl Health JSON Snapshot');
            console.log(`- Discovered URLs: ${totals.pageUrlsDiscovered ?? 'n/a'}`);
            console.log(`- Checked URLs: ${totals.pageUrlsChecked ?? 'n/a'}`);
            console.log(`- 2xx/3xx/4xx/5xx: ${status.status2xx ?? 0}/${status.status3xx ?? 0}/${status.status4xx ?? 0}/${status.status5xx ?? 0}`);
            console.log(`- Redirects: ${redirects}`);
            console.log(`- On-page SEO errors: ${onPageSeoErrors}`);
          } catch (error) {
            console.log('');
            console.log(`Crawl JSON parse failed: ${error instanceof Error ? error.message : String(error)}`);
          }
          EOF
          fi

          if [ -f data/seo-sitemap-blocklist.json ]; then
            node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          try {
            const blocklist = JSON.parse(fs.readFileSync('data/seo-sitemap-blocklist.json', 'utf8'));
            const stats = blocklist?.stats || {};
            console.log('');
            console.log('### Sitemap Blocklist Snapshot');
            console.log(`- Mode: ${blocklist?.mode || 'replace'}`);
            console.log(`- excludeExact: ${stats.excludeExact ?? 0}`);
            console.log(`- excludeRepo: ${stats.excludeRepo ?? 0}`);
            console.log(`- ignored: ${stats.ignored ?? 0}`);
          } catch (error) {
            console.log('');
            console.log(`Sitemap blocklist parse failed: ${error instanceof Error ? error.message : String(error)}`);
          }
          EOF
          fi

          if [ -f reports/seo/latest-structured-data-validation.json ]; then
            node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          try {
            const val = JSON.parse(fs.readFileSync('reports/seo/latest-structured-data-validation.json', 'utf8'));
            const failedSurfaces = (val.results || []).filter(r => !r.passed).map(r => r.surfaceId);
            console.log('');
            console.log('### Structured Data Validation Snapshot');
            console.log(`- P0 surfaces validated: ${val.totalSurfaces ?? 'n/a'}`);
            console.log(`- Passed: ${val.passed ?? 'n/a'} | Failed: ${val.failed ?? 'n/a'}`);
            if (failedSurfaces.length > 0) {
              console.log(`- Failed surfaces: ${failedSurfaces.join(', ')}`);
            }
          } catch (error) {
            console.log('');
            console.log(`Structured data validation parse failed: ${error instanceof Error ? error.message : String(error)}`);
          }
          EOF
          fi
