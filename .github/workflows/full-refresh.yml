name: Full Refresh (Manual)

# Full rebuild: force re-processes ALL skills
# Use when: AI prompts improved, new language added, schema changed, or monthly maintenance
# WARNING: This is expensive (3-6 hours, full AI API usage)

on:
  schedule:
    # 每 5 天执行一次 (UTC 03:00)
    - cron: '0 3 */5 * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm (required for manual trigger)'
        required: true
        type: string
      force:
        description: 'Force AI regeneration even if unchanged?'
        required: false
        type: boolean
        default: false
      skip_harvest:
        description: 'Skip harvest step?'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  full-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 10min buffer below GitHub's 360min hard limit
    # 定时触发直接跑；手动触发需输入 "yes"
    if: ${{ github.event_name == 'schedule' || inputs.confirm == 'yes' }}
    concurrency:
      group: skills-pipeline
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: false  # LFS fetched separately to avoid checkout failure on budget exceeded

      - name: Download cache artifact
        continue-on-error: true
        run: bash scripts/cache-artifact.sh download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Optional: Re-harvest ───────────────────────────
      - name: Harvest (optional)
        if: ${{ inputs.skip_harvest != true }}
        run: npx tsx scripts/harvest-github-skills.ts --target=100
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Full Build (skip unchanged) ─────────────────────
      - name: Build Skills Cache (Full Update)
        run: |
          ARGS="--mode=update --max-duration=330"
          # 仅手动触发且勾选 force 时才强制重新生成
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          echo "🔨 Running: npm run build:cache -- $ARGS"
          npm run build:cache -- $ARGS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── COMMIT FIRST ────────────────────────────────────
      # 必须先提交进度，再进行外部同步。
      # 这样即使 KV/D1 同步失败，skills-cache.json 也永远不会丢失，
      # 下次运行时 isSkillFullyOptimized() 可以跳过已处理的技能。
      - name: Commit and Push
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Pre-emptively pull latest to minimize conflicts before committing
            git pull --rebase --autostash origin main || true

            git add data/sitemap-skills.json data/expanded-github-skills.json
            git commit -m "chore(data): full skills refresh [skip ci]"
            PUSH_OK=0
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "✅ Push succeeded on attempt $attempt"
                PUSH_OK=1
                break
              fi
              echo "⚠️ Push failed (attempt $attempt), resolving conflicts..."
              sleep $((attempt * 3))
              git pull --rebase -X theirs --autostash origin main || true
            done
            if [ "$PUSH_OK" -eq 0 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
          else
            echo "ℹ️ No changes detected"
          fi

      # ── Upload cache artifact to GitHub Release ────────
      - name: Upload cache artifact
        continue-on-error: true
        if: hashFiles('data/skills-cache.json') != ''
        run: bash scripts/cache-artifact.sh upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Deploy to Cloudflare (non-blocking) ─────────────
      # 同步失败不会丢失进度（数据已在上一步提交到 git）
      - name: Sync to Cloudflare KV
        continue-on-error: true
        run: npm run sync:kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync to Cloudflare D1
        # Retry up to 3 times; abort if all fail
        run: |
          npx tsx scripts/generate-d1-seed.ts
          for i in {1..3}; do
            echo "🌀 Attempt $i to run D1 seeds..."
            if ./scripts/run-d1-seeds.sh; then
              echo "✅ D1 seeds applied successfully"
              break
            else
              echo "⚠️ Attempt $i failed, retrying..."
              sleep 5
            fi
          done
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Submit IndexNow
        if: success()
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
