name: Skills Crawler (Scheduled)

on:
  # Run twice daily — 00:00 and 12:00 UTC (with 6h52m gap between worst-case finishes)
  schedule:
    - cron: '0 0,12 * * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 10min buffer below GitHub's 360min hard limit
    concurrency:
      group: skills-pipeline
      cancel-in-progress: false

    steps:
      # ── Setup ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Step 1: Harvest new skill URLs ─────────────────────
      - name: Harvest GitHub Skills
        run: npm run skills:harvest -- --target=50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Early-commit harvest data ──────────────────
      - name: Commit Harvested Data
        run: |
          if [ -n "$(git status --porcelain data/expanded-github-skills.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/expanded-github-skills.json
            git commit -m "chore(data): harvest new skills [skip ci]"
            git pull --rebase --autostash origin main
            git push
            echo "✅ Harvest data committed"
          else
            echo "ℹ️ No new skills harvested"
          fi

      # ── Step 3: Build cache (AI translation + optimization) ─
      - name: Build Skills Cache
        run: npm run build:cache -- --mode=discover --max-duration=300
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── Step 4: Deploy to Cloudflare ───────────────────────
      - name: Sync to Cloudflare KV
        run: npm run sync:kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync to Cloudflare D1
        run: |
          npx tsx scripts/generate-d1-seed.ts
          npx wrangler d1 execute killer-skills-db --remote --file=db/seeds/initial.sql
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── Step 5: Commit + Push cache ────────────────────────
      - name: Commit and Push Cache
        run: |
          if [ -n "$(git status --porcelain data/skills-cache.json data/sitemap-skills.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/skills-cache.json data/sitemap-skills.json
            git commit -m "chore(data): update skills cache & sitemap [skip ci]"
            PUSH_OK=0
            for attempt in 1 2 3; do
              if git push; then
                echo "✅ Push succeeded on attempt $attempt"
                PUSH_OK=1
                break
              fi
              echo "⚠️ Push failed (attempt $attempt), resolving conflicts..."
              git pull --rebase -X theirs --autostash origin main || true
            done
            if [ "$PUSH_OK" -eq 0 ]; then
              echo "❌ Push failed after 3 attempts"
              exit 1
            fi
          else
            echo "ℹ️ No cache changes detected"
          fi

      # ── Step 6: Notify search engines ──────────────────────
      - name: Submit IndexNow
        if: success()
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
