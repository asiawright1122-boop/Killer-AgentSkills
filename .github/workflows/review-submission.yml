name: Async AI Review for Skill Submissions

on:
  repository_dispatch:
    types: [skill-submission]

jobs:
  review-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Dependencies
        run: HUSKY=0 npm ci

      - name: Create Review Branch
        id: branch
        env:
          AUTHOR: ${{ github.event.client_payload.owner }}
          REPO: ${{ github.event.client_payload.repo }}
        run: |
          SAFE_AUTHOR="$(printf '%s' "$AUTHOR" | tr -cs 'A-Za-z0-9._-' '-')"
          SAFE_REPO="$(printf '%s' "$REPO" | tr -cs 'A-Za-z0-9._-' '-')"
          BRANCH_NAME="review-skill-${SAFE_AUTHOR}-${SAFE_REPO}-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Execute LLM Review and Integration
        env:
          NVIDIA_API_KEY: ${{ secrets['NVIDIA_API_KEY'] }}
          SUBMISSION_OWNER: ${{ github.event.client_payload.owner }}
          SUBMISSION_REPO: ${{ github.event.client_payload.repo }}
        run: |
          npx tsx scripts/review-submission.ts

      - name: Commit and Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.client_payload.owner }}
          REPO: ${{ github.event.client_payload.repo }}
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "chore(skill): queue community submission review $AUTHOR/$REPO"
            git push origin "$BRANCH_NAME"
            
            gh pr create \
              --title "Review community skill submission - ${AUTHOR}/${REPO}" \
              --body "This PR was generated automatically by the \`skill-submission\` edge hook. It is an intake record only: no AI approval, security score, metadata enrichment, or localization should be treated as complete until a maintainer reviews the submitted repository." \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "No changes detected. The review script might have failed or the skill already exists."
          fi
