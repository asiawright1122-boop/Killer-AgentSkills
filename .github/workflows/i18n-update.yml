name: Auto Translate

run-name: >-
  Auto Translate / ${{
    github.event_name == 'schedule' && 'daily sweep' ||
    github.event_name == 'workflow_dispatch' && 'manual' ||
    github.event_name
  }}

on:
  schedule:
    # Daily translation sweep (12:25 Asia/Shanghai)
    - cron: '25 4 * * *'
  push:
    paths:
      - 'src/messages/en.json'
      - 'src/content/blog/en/*.md'
      - 'src/content/blog/zh/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: i18n-translate
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: HUSKY=0 npm ci

      - name: Validate AI Guardrails
        env:
          NVIDIA_API_KEYS: ${{ secrets['NVIDIA_API_KEY'] }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'
        run: npm run guard:ai-config

      - name: Run Translation
        env:
          NVIDIA_API_KEYS: ${{ secrets['NVIDIA_API_KEY'] }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_FALLBACK_POLICY: guarded
          WORKERS_AI_MODE: free-only
          WORKERS_AI_FREE_MAX_CALLS: '60'
          WORKERS_AI_FREE_DAILY_MAX_CALLS: '60'
        run: |
          echo "--- Phase 0: Backfill zh-only posts to en ---"
          npx tsx scripts/backfill-en-from-zh.ts
          echo "--- Phase 0.5: Sync translation keys (en.json → all locales) ---"
          npx tsx scripts/sync-translations.ts --write
          echo "--- Phase 1: Translate UI strings ---"
          npx tsx scripts/translate-locales.ts
          echo "--- Phase 2: Translate blog posts ---"
          npx tsx scripts/translate-blog.ts
          echo "--- Phase 3: Sync metadata globally ---"
          npx tsx scripts/sync-blog-everything.ts
          echo "--- Phase 4: Optimize blog meta descriptions for SEO ---"
          npx tsx scripts/ai-optimize-blog-meta.ts
      - name: Commit and Push
        run: |
          if [ -n "$(git status --porcelain src/messages/ src/content/blog/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # Pre-emptively pull latest to minimize conflicts before committing
            git pull --rebase --autostash origin main || true
            
            git add src/messages/*.json
            git add src/content/blog/*/*.md
            git commit -m "chore: auto-update translations [skip ci]"
            PUSH_OK=0
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "✅ Push succeeded on attempt $attempt"
                PUSH_OK=1
                break
              fi
              echo "⚠️ Push failed (attempt $attempt), rebasing..."
              sleep $((attempt * 3))
              git pull --rebase -X theirs --autostash origin main || true
            done
            if [ "$PUSH_OK" -eq 0 ]; then
              echo "❌ Push failed after 5 attempts"
              exit 1
            fi
          else
            echo "ℹ️ No translation changes"
          fi

      - name: Publish Translation Summary
        if: always()
        run: |
          echo "# Auto Translate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schedule: ${{ github.event.schedule || 'push / manual' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: messages + blog localization + blog metadata sync" >> "$GITHUB_STEP_SUMMARY"
