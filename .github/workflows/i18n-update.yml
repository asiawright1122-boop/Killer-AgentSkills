name: Auto Translate

on:
  push:
    paths:
      - 'src/messages/en.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: i18n-translate
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Translation
        env:
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx tsx scripts/translate-locales.ts

      - name: Commit and Push
        run: |
          if [ -n "$(git status --porcelain src/messages/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/messages/*.json
            git commit -m "chore: auto-update translations [skip ci]"
            for attempt in 1 2 3; do
              if git push; then
                echo "✅ Push succeeded"
                break
              fi
              echo "⚠️ Push failed (attempt $attempt), rebasing..."
              git pull --rebase --autostash origin main || true
            done
          else
            echo "ℹ️ No translation changes"
          fi
