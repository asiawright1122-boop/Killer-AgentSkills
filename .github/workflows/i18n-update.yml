name: Auto Translate

on:
  push:
    paths:
      - 'src/messages/en.json'
      - 'src/content/blog/en/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: i18n-translate
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Translation
        env:
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx tsx scripts/translate-locales.ts
          npx tsx scripts/translate-blog.ts
      - name: Commit and Push
        run: |
          if [ -n "$(git status --porcelain src/messages/ src/content/blog/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # Pre-emptively pull latest to minimize conflicts before committing
            git pull --rebase --autostash origin main || true
            
            git add src/messages/*.json
            git add src/content/blog/*/*.md
            git commit -m "chore: auto-update translations [skip ci]"
            PUSH_OK=0
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "✅ Push succeeded on attempt $attempt"
                PUSH_OK=1
                break
              fi
              echo "⚠️ Push failed (attempt $attempt), rebasing..."
              sleep $((attempt * 3))
              git pull --rebase -X theirs --autostash origin main || true
            done
            if [ "$PUSH_OK" -eq 0 ]; then
              echo "⚠️ Push failed after 5 attempts, continuing anyway..."
            fi
          else
            echo "ℹ️ No translation changes"
          fi
