name = "killer-skills"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Production secrets are managed via `wrangler secret put`:
#   wrangler secret put ADMIN_USER
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put ANALYTICS_HASH_SALT
# We deliberately do NOT define ADMIN_USER here as a public `[vars]` entry —
# `[vars]` values get baked into the build artifact, so a placeholder here
# would either become the real username (insecure) or shadow the secret
# (causing fail-closed 503s). Middleware fails closed when either secret is
# missing, so leaving this section empty is the correct posture.
[vars]

# The cross-isolate rate limiter in src/lib/rate-limit.ts uses the existing
# SKILLS_CACHE KV namespace as a counter store. KV's ~30s eventual-consistency
# propagation means an attacker hitting many PoPs could see slightly elevated
# allowance during the window, but this is strictly better than the previous
# per-isolate Map-based limiter (where bypass was unbounded). Consider
# [[ratelimits]] bindings or Durable Objects when sub-ms strict consistency
# becomes worth the rewrite cost.

[[kv_namespaces]]
binding = "TRANSLATIONS"
id = "d5ab5c6705774d779d9b1342eda5f9ac"

[[kv_namespaces]]
binding = "SKILLS_CACHE"
id = "6130f39a06e14319b0ee4becb0d09842"

[[d1_databases]]
binding = "DB"
database_name = "killer-skills-db"
database_id = "4b51522f-2413-4df2-b7d3-ac1cb1f3ef32"

[[services]]
binding = "WORKFLOWS_SERVICE"
service = "killer-skills-workflows"

[[vectorize]]
binding = "VECTORIZE"
index_name = "killer-skills-search"

[ai]
binding = "AI"
