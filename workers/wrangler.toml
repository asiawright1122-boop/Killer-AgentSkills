# Workflows Worker 配置
# 独立于 Astro 主应用部署

name = "killer-skills-workflows"
main = "index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV 命名空间绑定
[[kv_namespaces]]
binding = "SKILLS_CACHE"
id = "6130f39a06e14319b0ee4becb0d09842"

[[kv_namespaces]]
binding = "TRANSLATIONS"
id = "d5ab5c6705774d779d9b1342eda5f9ac"

[[d1_databases]]
binding = "DB"
database_name = "killer-skills-db"
database_id = "4b51522f-2413-4df2-b7d3-ac1cb1f3ef32"

# Workflows
[[workflows]]
name = "translation-workflow"
binding = "TRANSLATION_WORKFLOW"
class_name = "TranslationWorkflow"

[[workflows]]
name = "skill-validation-workflow"
binding = "SKILL_VALIDATION_WORKFLOW"
class_name = "SkillValidationWorkflow"

[[workflows]]
name = "content-workflow"
binding = "CONTENT_WORKFLOW"
class_name = "ContentProcessingWorkflow"

[vars]
SILICONFLOW_API_KEY = ""
